name: credential-pool-switcher
version: 1.3.0
description: "Switch between pooled provider accounts (e.g. multiple Claude logins) from chat (/switch), CLI, or the agent itself. Lists every account with priority, bench/dead state and Anthropic usage, moves any account to the front of the rotation, refuses unsafe switches (dead logins, env-fed API keys), and auto-rotates Anthropic logins by real quota usage (benches exhausted ones in auth.json under the auth-store lock). Model-initiated switches and auto rotations are escalated to human approval."
author: hendkai
kind: standalone
requires_hermes: ">=0.23.0"
provides_tools:
  - account_switch
provides_hooks:
  - pre_tool_call
provides_commands:
  - credential-pool-switcher
